name: Engine (Rust)

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The toolchain, its components and the wasm32 target come from engine/rust-toolchain.toml
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features threads -- -D warnings
      - run: cargo test --release --features threads
      - name: Build the wasm modules and run the Node test
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          sh js/build.sh
          node --test js/test/
