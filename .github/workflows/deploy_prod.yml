name: Deploy Prod
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  
jobs:
  build:
    name: ssh/pull/build
    runs-on: ubuntu-latest
    steps:
    - name: Pull code & Build
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.HOST }}
        port: ${{ secrets.PORT }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        script: |
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/${{ secrets.SSH_PUBLIC_KEY_NAME }}
            source ~/.zshrc
            # Deploy
            cd ${{ secrets.DIST }}
            git pull origin master
            # The page reads its heights with the Rust engine (WebAssembly), which the build stops without
            (cd engine && (rustup show active-toolchain || rustup toolchain install))
            cargo install wasm-bindgen-cli --version 0.2.130 --locked
            npm ci
            npm run build:engine
            npm run build
            
    - name: Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BETA }}
        DISCORD_USERNAME: "Github Monitoring"
        DISCORD_AVATAR: "https://i.imgur.com/lPRYnJx.png"
      uses: Ilshidur/action-discord@master
      with:
        args: |
          **${{ github.repository }}** has been deployed on squadcalc.app
          **Commit**: ${{ github.event.head_commit.message }}