name: Tests
permissions:
  contents: read
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, master ]

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - run: npm ci
    - run: npm test
