<dialog id="calcInformation" class="animate__animated animate__zoomIn">
    <form method="dialog">
        <button class="closeModal" data-i18n-aria-label="tooltips:closeDialog">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM175 175c9.4-9.4 24.6-9.4 33.9 0l47 47 47-47c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-47 47 47 47c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-47-47-47 47c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l47-47-47-47c-9.4-9.4-9.4-24.6 0-33.9z"/></svg>
        </button>
    </form>

    <h2 data-i18n="common:targetInf">Target Informations</h2>

    <div id="targetOptions">
        <table>
            <tbody>
                <tr id="targetHeightRow" hidden>
                    <td data-i18n="common:targetHeightChoice" class="infTargetHeightTooltip info"></td>
                    <td><select id="targetHeightSelect" data-i18n-aria-label="common:targetHeightChoice"></select></td>
                </tr>
                <tr id="positionHeatRow" hidden>
                    <td data-i18n="common:heatRow" class="infPositionHeatTooltip info"></td>
                    <td><button type="button" id="positionHeatButton"></button></td>
                </tr>
                <tr id="structureRow" hidden>
                    <td data-i18n="common:structureShells" class="infStructureTooltip info"></td>
                    <td class="infStructure"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="canvasControls">
        <button data-i18n="common:weapon1" type="button" class="active" value="sim1"></button>
        <button data-i18n="common:weapon2" type="button" class="" value ="sim2"></button>
    </div>
    
    <div id="sim1" class="sim active">
        <table>
            <tbody>
                <tr>
                    <td data-i18n="common:bearing" class="infBearingTooltip info"></td><td class="infBearing"></td>
                </tr>
                <tr>
                    <td data-i18n="common:elevation"></td><td class="infElevation"></td>
                </tr>
                <tr>
                    <td data-i18n="common:distance" class="infDistanceTooltip info"></td><td class="infDistance"></td>
                </tr>
                <tr>
                    <td data-i18n="common:timeOfFlight"></td><td class="infTimeOfFlight"></td>
                </tr>
            </tbody>
        </table>

        <table>
            <tbody>
                <tr>
                    <td data-i18n="common:spread" class="infSpreadTooltip info"></td><td class="infSpread"></td>
                </tr>
                <tr>
                    <td data-i18n="common:weaponHeight"></td><td class="infWHeight"></td>
                </tr>
                <tr>
                    <td data-i18n="common:targetHeight"></td><td class="infTHeight"></td>
                </tr>
                <tr>
                    <td data-i18n="common:heightDiff"></td><td class="infDHeight"></td>
                </tr>
            </tbody>
        </table>
        <canvas class="heightGraph" width="1000" height="600"></canvas>
    </div>

    <div id="sim2" class="sim">
        <table>
            <tbody>
                <tr>
                    <td data-i18n="common:bearing" class="infBearingTooltip info"></td><td class="infBearing"></td>
                </tr>
                <tr>
                    <td data-i18n="common:elevation"></td><td class="infElevation"></td>
                </tr>
                <tr>
                    <td data-i18n="common:distance" class="infDistanceTooltip info"></td><td class="infDistance"></td>
                </tr>
                <tr>
                    <td data-i18n="common:timeOfFlight"></td><td class="infTimeOfFlight"></td>
                </tr>
            </tbody>
        </table>

        <table>
            <tbody>
                <tr>
                    <td data-i18n="common:spread" class="infSpreadTooltip info"></td><td class="infSpread"></td>
                </tr>
                <tr>
                    <td data-i18n="common:weaponHeight"></td><td class="infWHeight"></td>
                </tr>
                <tr>
                    <td data-i18n="common:targetHeight"></td><td class="infTHeight"></td>
                </tr>
                <tr>
                    <td data-i18n="common:heightDiff"></td><td class="infDHeight"></td>
                </tr>
            </tbody>
        </table>
        <canvas class="heightGraph" width="1000" height="600"></canvas>
    </div>

</dialog>
